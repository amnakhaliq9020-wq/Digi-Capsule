services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: digi
      POSTGRES_PASSWORD: digi
      POSTGRES_DB: digi_capsule
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - digi_capsule_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digi -d digi_capsule"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  digi_capsule_pg:
